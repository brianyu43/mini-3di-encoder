[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-3di-encoder"
version = "0.1.0.dev1"
description = "A learning project to reproduce coordinate-based Foldseek 3Di encoding"
requires-python = ">=3.12,<3.13"
dependencies = ["biopython", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mini3di_encoder = ["data/*.json", "data/*.kerasify", "data/*LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["references/upstream", "tools", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
